[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pirate-trading"
version = "0.1.0"
description = "A single-player pirate trading sandbox with a living simulated world."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pygame-ce>=2.5,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
pirate-trading = "pirate_trading.__main__:main"
pirate-trading-headless = "pirate_trading.headless:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
